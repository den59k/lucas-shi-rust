# Standalone crate: a thin wasm-bindgen wrapper exposing detection and tracking
# separately so the Node harness can time each against OpenCV.js.
[workspace]

[package]
name = "opencv-compare-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
optical-flow-lk = { path = "../../.." }
image = { version = "0.25", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
