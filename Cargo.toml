[package]
name = "optical-flow-lk"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
authors = ["den59k <den59k@gmail.com>", "Claude <noreply@anthropic.com>"]
description = "Rust implementation of Lucas-Kanade optical flow and Shi-Tomasi feature detection"
license = "MIT"
repository = "https://github.com/den59k/lucas-shi-rust"
documentation = "https://docs.rs/optical-flow-lk"
keywords = ["optical-flow", "tracking", "computer-vision", "feature-detection", "visual-odometry"]
categories = ["computer-vision", "algorithms", "science"]

# Release builds (including the wasm32 artifact) get full optimization. `lto`
# and a single codegen unit matter especially for WASM, where they let the
# inliner collapse the SIMD/interpolation hot paths.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The library only uses the `image` buffer types (`GrayImage`, `ImageBuffer`,
# `Luma`, `Pixel`), so it enables no codecs; applications choose their own.
[dependencies]
image = { version = "0.25.10", default-features = false }

# Examples, tests and benches decode the bundled PNG frames.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
imageproc = "0.27.0"
# Reference eigensolver / SVD for tests and benches only; the library has no linear-algebra dependency.
nalgebra = "0.34.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

# WASI has no worker threads; use Criterion's sequential bootstrap analysis.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "gradients"
harness = false

[[bench]]
name = "lk"
harness = false

[[bench]]
name = "tracking"
harness = false

[[bench]]
name = "features"
harness = false

[[bench]]
name = "feature_stages"
harness = false

[[bench]]
name = "float"
harness = false
